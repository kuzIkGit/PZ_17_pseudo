<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Интерактивные карточки</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <main>
      <section class="banner">
        <p>Городские истории</p>
        <h1>Наведите курсор и исследуйте</h1>
        <a class="banner__link" href="#cards">Перейти к карточкам</a>
      </section>
      <section id="cards" class="cards">
        <a class="card card--featured" href="#" data-tooltip="Открыть: Двор">
          <span>01</span>
          <h2>Двор</h2>
          <p>История тихого двора.</p>
        </a>
        <a class="card" href="#" data-tooltip="Открыть: Мост">
          <span>02</span>
          <h2>Мост</h2>
          <p>Маршрут через старый мост.</p>
        </a>
        <a class="card card--important" href="#" data-tooltip="Открыть: Вывеска">
          <span>03</span>
          <h2>Вывеска</h2>
          <p>Старый неоновый знак.</p>
        </a>
      </section>
    </main>
  </body>
</html>
